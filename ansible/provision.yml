---
- name: Provision the AWS server with k3s (Kubernetes)
  hosts: aws_server
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install curl
      apt:
        name: curl
        state: present

    - name: Install k3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Make the kubeconfig file readable by the ubuntu user
      file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: "0644"

    - name: Wait for k3s to be ready
      command: k3s kubectl get nodes
      register: result
      retries: 10
      delay: 5
      until: result.rc == 0